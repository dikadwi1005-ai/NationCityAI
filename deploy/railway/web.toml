# Legacy only; for new Railway services use deploy/railway/README.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile"
[deploy]
startCommand = "node scripts/staging-service.mjs web"
healthcheckPath = "/api/health"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
