name: Closed beta source checks
on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/government-recovery.mjs
      - run: node tests/recovery-remote.mjs
      - run: node tests/postgres-migration.mjs
      - name: Build deployment image without cloud credentials
        run: docker build --tag nationcity:phase5b --file deploy/railway/Dockerfile .
